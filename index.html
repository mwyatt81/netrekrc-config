<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Config Console</title>
<!-- bootstrap@5.3.3 -->
<link rel="icon" href="trek.ico" type="image/x-icon">
<link href="css/bootstrap.min.css" rel="stylesheet">

<style>
  :root{
    --bg: #0a0d10;
    --panel: #11161b;
    --panel-2: #161d24;
    --line: #232c34;
    --amber: #ffb454;
    --amber-dim: #8a6a3c;
    --green: #6fffb0;
    --text: #d7dee4;
    --text-dim: #7d8a94;
    --danger: #ff6b6b;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,180,84,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,255,176,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
  }
  h1,h2,h3,h4,.brand,.tab-title{ font-family:'Chakra Petch', sans-serif; letter-spacing:.02em; }

  /* ---- Header ---- */
  .console-header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .brand{
    font-weight:700; font-size:1.15rem; color:var(--text);
    display:flex; align-items:center; gap:.55rem;
  }
  .brand .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--green); box-shadow:0 0 8px var(--green);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .brand .dot.dirty{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .brand small{ color:var(--text-dim); font-weight:400; font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; }

  .btn-console{
    font-family:'JetBrains Mono', monospace; font-size:.78rem; letter-spacing:.04em;
    text-transform:uppercase; border-radius:3px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); padding:.45rem .75rem;
    transition:.15s;
  }
  .btn-console:hover{ border-color:var(--amber-dim); color:var(--amber); background:#1a2229; }
  .btn-console.primary{ border-color:var(--amber); color:#1a1408; background:var(--amber); font-weight:600; }
  .btn-console.primary:hover{ background:#ffc677; color:#1a1408; }
  .btn-console:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---- Layout ---- */
  .console-body{ display:flex; min-height:calc(100vh - 64px); }
  .tab-rail{
    width:230px; flex:none; border-right:1px solid var(--line);
    background:var(--panel); overflow-y:auto;
  }
  .tab-item{
    display:flex; align-items:center; gap:.6rem;
    padding:.6rem .9rem; cursor:pointer; border-left:2px solid transparent;
    color:var(--text-dim); font-size:.82rem; text-transform:uppercase; letter-spacing:.03em;
    user-select:none;
  }
  .tab-item .num{ font-size:.68rem; color:var(--text-dim); width:1.3rem; flex:none; }
  .tab-item:hover{ background:var(--panel-2); color:var(--text); }
  .tab-item.active{ background:var(--panel-2); color:var(--amber); border-left-color:var(--amber); }
  .tab-item .badge-mod{
    margin-left:auto; font-size:.62rem; background:rgba(255,180,84,.15); color:var(--amber);
    border:1px solid var(--amber-dim); border-radius:10px; padding:0 .4rem; line-height:1.35;
  }

  .content-pane{ flex:1; padding:1.5rem 2rem 4rem; overflow-y:auto; }
  .tab-title{ font-size:1.2rem; color:var(--text); margin-bottom:.1rem; }
  .tab-sub{ color:var(--text-dim); font-size:.78rem; margin-bottom:1.4rem; }

  .field-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:.9rem 1.4rem; }
  .field{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:.6rem .75rem; }
  .field.modified{ border-color:var(--amber-dim); background:linear-gradient(180deg, rgba(255,180,84,.04), var(--panel)); }
  .field label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.35rem;
  }
  .field label .key{ color:var(--text-dim); }
  .field label .flag{ color:var(--amber); font-size:.62rem; }
  .field .form-control, .field .form-select{
    background:#0d1216; border:1px solid var(--line); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:.85rem; border-radius:3px;
  }
  .field .form-control:focus, .field .form-select:focus{
    border-color:var(--amber-dim); box-shadow:0 0 0 .15rem rgba(255,180,84,.12); background:#0d1216; color:var(--text);
  }
  .field-checkbox{ display:flex; align-items:center; justify-content:space-between; }
  .field-checkbox label{ margin-bottom:0; }
  .form-check-input{ background-color:#0d1216; border-color:var(--line); width:2.3em; height:1.25em; }
  .form-check-input:checked{ background-color:var(--green); border-color:var(--green); }
  .form-check-input:focus{ box-shadow:0 0 0 .15rem rgba(111,255,176,.15); }

  .color-swatch{ width:1.1rem; height:1.1rem; border-radius:2px; border:1px solid var(--line); flex:none; }

  .section-note{
    border:1px dashed var(--line); border-radius:4px; padding:.7rem .9rem; color:var(--text-dim);
    font-size:.76rem; margin-bottom:1.2rem; background:rgba(255,255,255,.015);
  }
  .section-note strong{ color:var(--amber); }

  .dyn-table{ width:100%; border-collapse:collapse; font-size:.8rem; }
  .dyn-table th{ text-align:left; color:var(--text-dim); text-transform:uppercase; font-size:.66rem; letter-spacing:.05em; padding:.4rem .5rem; border-bottom:1px solid var(--line); }
  .dyn-table td{ padding:.35rem .5rem; border-bottom:1px solid var(--line); vertical-align:middle; }
  .dyn-table input{ width:100%; }
  .icon-btn{ background:none; border:1px solid var(--line); color:var(--text-dim); border-radius:3px; width:1.8rem; height:1.8rem; line-height:1; }
  .icon-btn:hover{ color:var(--danger); border-color:var(--danger); }
  .add-row-btn{ font-size:.75rem; }

  .window-card{ border:1px solid var(--line); border-radius:4px; padding:.7rem .85rem; margin-bottom:.7rem; background:var(--panel); }
  .window-card .wname{ color:var(--amber); font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.5rem; }
  .window-card .row-fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.5rem .8rem; }
  .window-card .row-fields .sub-label{ font-size:.62rem; color:var(--text-dim); text-transform:uppercase; display:block; margin-bottom:.2rem; }

  .file-status{ font-size:.72rem; color:var(--text-dim); }
  .file-status .loaded{ color:var(--green); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }

  .toast-console{
    position:fixed; bottom:1.2rem; right:1.2rem; z-index:2000;
    background:var(--panel-2); border:1px solid var(--amber-dim); color:var(--amber);
    padding:.6rem 1rem; border-radius:4px; font-size:.8rem; opacity:0; transform:translateY(8px);
    transition:.25s; pointer-events:none;
  }
  .toast-console.show{ opacity:1; transform:translateY(0); }

  @media (max-width:860px){
    .console-body{ flex-direction:column; }
    .tab-rail{ width:100%; display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); }
    .tab-item{ border-left:none; border-bottom:2px solid transparent; white-space:nowrap; }
    .tab-item.active{ border-bottom-color:var(--amber); }
    .content-pane{ padding:1.2rem; }
  }
  
  .tooltip-inner {
    font-family: 'Courier New', monospace;
    color: #AC3;
    text-align: left;
  }
    .tooltipWide { --bs-tooltip-max-width: 500px !important; }  
</style>
</head>
<body>

<header class="console-header px-3 px-md-4 py-2 d-flex align-items-center justify-content-between flex-wrap gap-2">
  <div class="brand">
    <span class="dot" id="dirtyDot"></span>
    RC CONFIG CONSOLE
    <small class="ms-2"><img src="badge.png" width="32" height="32"> netrek client settings editor</small>
  </div>
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <span class="file-status" id="fileStatus">No file loaded &mdash; editing defaults</span>
    <input type="file" id="fileInput" accept=".txt,.cfg,.rc,.ini,*" class="d-none">
    <button class="btn btn-console" id="loadBtn">Load RC File</button>
    <button class="btn btn-console" id="resetBtn">Reset to Defaults</button>
    <button class="btn btn-console primary" id="downloadBtn">Download RC File</button>
  </div>
</header>

<div class="console-body">
  <nav class="tab-rail" id="tabRail"></nav>
  <main class="content-pane" id="contentPane"></main>
</div>

<div class="toast-console" id="toast"></div>

<!-- bootstrap@5.3.3 -->
<script src="js/bootstrap.bundle.min.js"></script>

<script src="schema.js"></script>
<script src="app.js"></script>
</body>
</html>
